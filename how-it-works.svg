<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" role="img" aria-label="RoadSense AI pipeline: capture, EXIF check, duplicate check, Gemini Vision, priority, track and fix" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.5" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#00F5A0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="240" rx="18" fill="url(#bg)"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">One photo → verified, prioritized, trackable repair</text>

  <!-- track -->
  <line x1="20" y1="120" x2="860" y2="120" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
  <line x1="20" y1="120" x2="860" y2="120" stroke="url(#line)" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- stage 1 -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="80" width="125" height="80" rx="14" fill="#0b1720" stroke="#00D4FF" stroke-opacity="0.6"/>
    <rect x="20" y="80" width="125" height="80" rx="14" fill="#00D4FF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.45;0;0" keyTimes="0;0.024;0.074;0.134;1" dur="7.2s" repeatCount="indefinite"/>
    </rect>
    <text x="82" y="112" font-size="24">📸</text>
    <text x="82" y="136" font-size="13" font-weight="700" fill="#fff">Capture</text>
    <text x="82" y="152" font-size="10" fill="#9fc9d6">photo · video · pin</text>

    <!-- stage 2 -->
    <rect x="163" y="80" width="125" height="80" rx="14" fill="#0b1720" stroke="#00D4FF" stroke-opacity="0.6"/>
    <rect x="163" y="80" width="125" height="80" rx="14" fill="#00D4FF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.45;0;0" keyTimes="0;0.194;0.244;0.304;1" dur="7.2s" repeatCount="indefinite"/>
    </rect>
    <text x="225" y="112" font-size="24">🛡️</text>
    <text x="225" y="136" font-size="13" font-weight="700" fill="#fff">EXIF Check</text>
    <text x="225" y="152" font-size="10" fill="#9fc9d6">real or downloaded?</text>

    <!-- stage 3 -->
    <rect x="306" y="80" width="125" height="80" rx="14" fill="#0b1720" stroke="#00D4FF" stroke-opacity="0.6"/>
    <rect x="306" y="80" width="125" height="80" rx="14" fill="#00D4FF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.45;0;0" keyTimes="0;0.364;0.414;0.474;1" dur="7.2s" repeatCount="indefinite"/>
    </rect>
    <text x="368" y="112" font-size="24">🔍</text>
    <text x="368" y="136" font-size="13" font-weight="700" fill="#fff">Duplicates</text>
    <text x="368" y="152" font-size="10" fill="#9fc9d6">15 m · 14 days</text>

    <!-- stage 4 -->
    <rect x="449" y="80" width="125" height="80" rx="14" fill="#0b1720" stroke="#00F5A0" stroke-opacity="0.8"/>
    <rect x="449" y="80" width="125" height="80" rx="14" fill="#00F5A0" opacity="0">
      <animate attributeName="opacity" values="0;0;0.45;0;0" keyTimes="0;0.535;0.585;0.645;1" dur="7.2s" repeatCount="indefinite"/>
    </rect>
    <text x="511" y="112" font-size="24">✨</text>
    <text x="511" y="136" font-size="13" font-weight="700" fill="#fff">Gemini Vision</text>
    <text x="511" y="152" font-size="10" fill="#9fe8c8">type · severity · why</text>

    <!-- stage 5 -->
    <rect x="592" y="80" width="125" height="80" rx="14" fill="#0b1720" stroke="#00D4FF" stroke-opacity="0.6"/>
    <rect x="592" y="80" width="125" height="80" rx="14" fill="#00D4FF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.45;0;0" keyTimes="0;0.705;0.755;0.815;1" dur="7.2s" repeatCount="indefinite"/>
    </rect>
    <text x="654" y="112" font-size="24">🚦</text>
    <text x="654" y="136" font-size="13" font-weight="700" fill="#fff">Prioritize</text>
    <text x="654" y="152" font-size="10" fill="#9fc9d6">severity-ranked queue</text>

    <!-- stage 6 -->
    <rect x="735" y="80" width="125" height="80" rx="14" fill="#0b1720" stroke="#00D4FF" stroke-opacity="0.6"/>
    <rect x="735" y="80" width="125" height="80" rx="14" fill="#00D4FF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.45;0;0" keyTimes="0;0.875;0.925;0.985;1" dur="7.2s" repeatCount="indefinite"/>
    </rect>
    <text x="797" y="112" font-size="24">📍</text>
    <text x="797" y="136" font-size="13" font-weight="700" fill="#fff">Track &amp; Fix</text>
    <text x="797" y="152" font-size="10" fill="#9fc9d6">live status · dashboards</text>
  </g>

  <!-- travelling pulse -->
  <circle r="7" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="7.2s" repeatCount="indefinite" path="M20,120 L860,120"/>
  </circle>

  <text x="440" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fc9d6">Average pipeline response: 1.42 s · Defect-type accuracy: 93.3 % (224 / 240 held-out images)</text>
</svg>
